
name: Weekly Project Summary

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1"

permissions:
  issues: write
  contents: read

jobs:
  weekly-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Create weekly summary issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Weekly Project Summary - ${new Date().toISOString().slice(0,10)}`;

            const body = `## Weekly Review
            - Completed tasks:
            - Pending tasks:
            - Blockers:
            - Next week's priorities:
            - AI corrections:

            Please update the task board.`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body
            });
